services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    env_file:
      - .env
    environment:
      # Apache mod_php (pas de fastcgi_finish_request) : déploiement MikroTik dans la requête HTTP.
      WIFIZONE_HOTSPOT_DEPLOY_INLINE: ${WIFIZONE_HOTSPOT_DEPLOY_INLINE:-1}
      WIFIZONE_PPPOE_DEPLOY_INLINE: ${WIFIZONE_PPPOE_DEPLOY_INLINE:-1}
      PHP_CLI_PATH: ${PHP_CLI_PATH:-/usr/local/bin/php}
    volumes:
      - wifizone_uploads:/var/www/html/system/uploads
      - wifizone_cache:/var/www/html/system/cache
      - wifizone_smarty_compiled:/var/www/html/ui/compiled
      - wifizone_smarty_cache:/var/www/html/ui/cache

  cron:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      WIFIZONE_HOTSPOT_DEPLOY_INLINE: ${WIFIZONE_HOTSPOT_DEPLOY_INLINE:-1}
      WIFIZONE_PPPOE_DEPLOY_INLINE: ${WIFIZONE_PPPOE_DEPLOY_INLINE:-1}
      PHP_CLI_PATH: ${PHP_CLI_PATH:-/usr/local/bin/php}
    command: sh -c "while true; do php /var/www/html/system/cron_wifizone.php; sleep 300; done"
    volumes:
      - wifizone_uploads:/var/www/html/system/uploads
      - wifizone_cache:/var/www/html/system/cache

volumes:
  wifizone_uploads:
  wifizone_cache:
  wifizone_smarty_compiled:
  wifizone_smarty_cache:
