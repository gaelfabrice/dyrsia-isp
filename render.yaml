services:
  - type: web
    name: wifizone
    runtime: docker
    plan: starter
    autoDeploy: true
    healthCheckPath: /health.php
    envVars:
      - key: APP_STAGE
        value: Live
      - key: APP_URL
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
