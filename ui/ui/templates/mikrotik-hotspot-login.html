<script>
window.HOTSPOT_INLINE_MD5=true;
const APP_URL = "http:\/\/10.0.0.2:8080";
const HOTSPOT_ROUTER_NAME = "$(identity)";
const HOTSPOT_EMBEDDED_PLANS = [];
const HOTSPOT_DNS_NAME = "";
const HOTSPOT_PAYMENT_GATEWAY = "campay";
let CLIENT_MAC = '';
(function(){const m='$(mac)';if(/^([0-9A-Fa-f]{2}[:\-]){5}[0-9A-Fa-f]{2}$/i.test(m))CLIENT_MAC=m.toUpperCase();})();

function escHtml(s){return String(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}

const HOTSPOT_PHONE_LEN = 9;
function cleanHotspotPhone(value) {
  return String(value || '').replace(/\D/g, '').slice(0, HOTSPOT_PHONE_LEN);
}
function validateHotspotPhoneLen(value) {
  return cleanHotspotPhone(value).length === HOTSPOT_PHONE_LEN ? null : '9 chiffres obligatoires (ex: 677123456)';
}
function hotspotPhoneInputAttrs() {
  return { maxlength: HOTSPOT_PHONE_LEN, minlength: HOTSPOT_PHONE_LEN, inputmode: 'numeric', pattern: '[0-9]*', autocomplete: 'off' };
}
function bindHotspotPhoneField(el) {
  if (!el) return;
  const trim = () => { el.value = cleanHotspotPhone(el.value); };
  el.addEventListener('input', trim);
  el.addEventListener('paste', (e) => {
    e.preventDefault();
    el.value = cleanHotspotPhone((e.clipboardData || window.clipboardData).getData('text'));
  });
}

async function api(route,opts){
  const base=(APP_URL||'').replace(/\/$/,'');
  const bases=[];
  if(base)bases.push(base);
  // Repli proxy local (VPN) uniquement si APP_URL échoue.
  try{const h=new URL(window.location.origin).hostname;if(/^(10\.|192\.168\.)/.test(h)){const proxy='http://'+h+':8080';if(!bases.includes(proxy))bases.push(proxy);}}catch(e){}
  let last;
  for(const b of[...new Set(bases)]){
    try{
      const r=await fetch(b+'/index.php?_route=plugin/'+route,opts);
      if(r.ok||(r.headers.get('content-type')||'').toLowerCase().includes('json'))return r;
      last=new Error('HTTP '+r.status+' via '+b);
    }catch(e){last=e;}
  }
  throw last||new Error('API injoignable');
}

function renderPlans(plans){
  const c=document.getElementById('plansList');
  if(!plans||!plans.length){c.innerHTML='<div style="text-align:center;color:#f87171">Aucun forfait disponible</div>';return;}
  const rn=HOTSPOT_ROUTER_NAME;
  c.innerHTML=plans.map(p=>{
    const id=p.planid||p.planId||'';
    const link=p.paymentlink||(APP_URL+'/index.php?_route=plugin/hotspot_pay&routername='+encodeURIComponent(rn)+'&planid='+encodeURIComponent(id)+'&amount='+encodeURIComponent(p.price||''));
    return`<div class="plan" data-plan-name="${escHtml(p.planname||p.name||'')}" data-plan-price="${escHtml(p.price||'')}" data-plan-currency="${escHtml(p.currency||'Fcfa')}" data-plan-validity="${escHtml(p.validity||'')}" data-plan-id="${escHtml(id)}" data-router-name="${escHtml(rn)}"><div><div class="plan-name">⚡ ${escHtml(p.planname||p.name||'')}</div><div class="plan-detail">⏱️ ${escHtml(p.validity||'')}</div></div><div><span class="plan-price">${escHtml(p.price||'')} ${escHtml(p.currency||'Fcfa')}</span><span class="badge">ILLIMITÉ</span></div></div>`;
  }).join('');

  // Add click handlers via event delegation
  c.querySelectorAll('.plan').forEach(el=>{
    el.addEventListener('click',()=>{
      const nom=el.dataset.planName;
      const prix=el.dataset.planPrice;
      const currency=el.dataset.planCurrency;
      const validite=el.dataset.planValidity;
      const planid=el.dataset.planId;
      const routername=el.dataset.routerName;
      payer(nom,prix,currency,validite,planid,routername);
    });
  });
}

async function loadPlans(){
  const c=document.getElementById('plansList');
  if(HOTSPOT_EMBEDDED_PLANS&&HOTSPOT_EMBEDDED_PLANS.length){renderPlans(HOTSPOT_EMBEDDED_PLANS);return;}
  c.innerHTML='<div style="text-align:center;padding:12px;color:#6b7280">⏳ Chargement...</div>';
  try{
    const r=await api('hotspot_plan',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'routername='+encodeURIComponent(HOTSPOT_ROUTER_NAME)});
    const d=await r.json();
    if(d.data&&d.data.length)renderPlans(d.data);
    else c.innerHTML='<div style="text-align:center;color:#f87171">'+(d.message||'Aucun forfait disponible')+'</div>';
  }catch(e){c.innerHTML='<div style="text-align:center;color:#f87171">⚠️ API injoignable</div>';}
}

async function poll(ref,max){
  const dl=Date.now()+max*1000;
  while(Date.now()<dl){
    await new Promise(r=>setTimeout(r,2000));
    try{const r=await api('hotspot_verify&reference='+encodeURIComponent(ref)+'&format=json',{headers:{Accept:'application/json'}});
    const d=await r.json();if(['paid','failed','cancelled'].includes(d.status))return d;}catch(e){}
  }
  return{status:'timeout',message:'Délai dépassé. Vérifiez votre téléphone.'};
}

function resetHotspotPasswordChap() {
  const passEl = document.getElementById('pass');
  if (passEl) delete passEl.dataset.chapDone;
}

function prepareMikrotikLogin(form) {
  if (!form) return false;
  const passwordInput = form.querySelector('input[name="password"]');
  const chapId = '$(chap-id)';
  const chapChallenge = '$(chap-challenge)';
  const hasChap = chapId && chapChallenge && chapId.indexOf('$(') !== 0 && chapChallenge.indexOf('$(') !== 0;
  if (hasChap && passwordInput && !passwordInput.dataset.chapDone) {
    if (typeof hexMD5 === 'function') {
      passwordInput.value = hexMD5(chapId + passwordInput.value + chapChallenge);
      passwordInput.dataset.chapDone = '1';
    }
  }
  return true;
}

function submitHotspotLogin() {
  const f = document.getElementById('loginForm');
  if (!f) return;
  prepareMikrotikLogin(f);
  f.submit();
}

function fillAndSubmitHotspotLogin(username, password) {
  const form = document.getElementById('loginForm');
  const userEl = document.getElementById('user') || document.getElementById('loginUsername');
  const passEl = document.getElementById('pass') || document.getElementById('loginPassword');
  if (userEl) userEl.value = username || '';
  if (passEl) {
    passEl.value = password || username || '';
    delete passEl.dataset.chapDone;
  }
  if (!form) return;
  if (typeof Swal !== 'undefined' && Swal.close) Swal.close();
  prepareMikrotikLogin(form);
  form.submit();
}

function connecter(user,pass,nom){Swal.fire({html:'<b>✅ '+escHtml(nom)+'</b><br>Connexion Internet en cours…<br><small>Un SMS de rappel peut suivre (optionnel)</small>',showConfirmButton:false,timer:1500});setTimeout(function(){fillAndSubmitHotspotLogin(user,pass||'123456');},500);}

async function payer(nom,prix,currency,validite,planid,routername){
  const {value:phone}=await Swal.fire({title:`💰 ${nom} — ${prix} ${currency||'Fcfa'}`,text:'Numéro Mobile Money (9 chiffres obligatoires)',input:'tel',inputPlaceholder:'677123456',inputAttributes:hotspotPhoneInputAttrs(),showCancelButton:true,confirmButtonText:'Payer',cancelButtonText:'Annuler',didOpen:()=>bindHotspotPhoneField(Swal.getInput()),inputValidator:validateHotspotPhoneLen});
  if(!phone)return;
  try{
    const msisdn='237'+cleanHotspotPhone(phone);
    const body=new URLSearchParams({pay:'1',type:'gateways',payment_gateway:HOTSPOT_PAYMENT_GATEWAY,routername:routername||HOTSPOT_ROUTER_NAME,planid,amount:prix,plan_name:nom,mac_address:CLIENT_MAC||'$(mac)',ip_address:'$(ip)',msisdn,phonenumber:msisdn,ajax:'1'});
    const r=await api('hotspot_pay',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded','X-Requested-With':'XMLHttpRequest'},body:body.toString()});
    const d=await r.json();
    if(!d.ok){Swal.fire('Refusé',d.message||'Erreur paiement','error');return;}
    Swal.fire({title:'Validez sur votre téléphone',html:'📱 Composez: <b style="color:#10b981;font-size:1.4em">'+(d.ussd_code||'*126#')+'</b><br><small>Ne fermez pas cette page</small>',allowOutsideClick:false,showConfirmButton:false});
    const res=await poll(d.reference,60);
    Swal.close();
    if(res.status==='paid')connecter(res.voucher_code||res.username,res.password||'123456',nom);
    else if(res.status==='failed')Swal.fire('Échec',res.message||'Transaction refusée','error');
    else Swal.fire('En attente','Confirmation non reçue. Si validé, attendez 1 minute.','warning');
  }catch(e){Swal.fire('Erreur réseau',e.message||'Impossible de contacter le serveur','error');}
}

async function utiliserVoucher(){
  const {value:code}=await Swal.fire({title:'🎫 Code voucher',input:'text',inputPlaceholder:'XXXX-XXXX-XXXX',showCancelButton:true,confirmButtonText:'Valider',cancelButtonText:'Annuler',inputValidator:v=>(!v||!v.trim())?'Saisissez votre code':null});
  if(!code||!code.trim())return;
  try{
    const r=await api('hotspot_voucher_check',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'voucher='+encodeURIComponent(code.trim())});
    const d=await r.json();
    if(d.success)connecter(d.username,d.password||d.username,'Voucher');
    else Swal.fire('Invalide',d.message||'Code incorrect','error');
  }catch(e){Swal.fire('Erreur réseau',e.message,'error');}
}

async function recupererForfait(){
  const {value:phone}=await Swal.fire({title:'🔑 Récupérer mon forfait',text:'Numéro Mobile Money (9 chiffres obligatoires)',input:'tel',inputPlaceholder:'677123456',inputAttributes:hotspotPhoneInputAttrs(),showCancelButton:true,confirmButtonText:'Rechercher',didOpen:()=>bindHotspotPhoneField(Swal.getInput()),inputValidator:validateHotspotPhoneLen});
  if(!phone)return;
  try{
    const r=await api('hotspot_recover_plan',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'phone='+encodeURIComponent(cleanHotspotPhone(phone))});
    const d=await r.json();
    if(d.success)connecter(d.username,d.password||d.username,'Forfait récupéré');
    else Swal.fire('Non trouvé',d.message||'Aucun forfait actif','error');
  }catch(e){Swal.fire('Erreur réseau',e.message,'error');}
}

document.getElementById('loginBtn').addEventListener('click',async()=>{
  const u=document.getElementById('user').value.trim();
  const p=document.getElementById('pass').value.trim();
  const err=document.getElementById('errorMsg');
  if(!u||!p){err.innerText='Identifiant et mot de passe requis';err.style.display='block';return;}
  err.style.display='none';
  try{
    const r=await api('hotspot_account_check',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'username='+encodeURIComponent(u)+'&password='+encodeURIComponent(p)});
    const d=await r.json();
    if(d.success)connecter(d.username,d.password||p,'Connexion');
    else{err.innerText=d.message||'Identifiants incorrects';err.style.display='block';}
  }catch(e){
    const f=document.getElementById('loginForm');
    if(f&&f.action.indexOf('$(link-login-only)')<0){submitHotspotLogin();}
    else{err.innerText='Erreur de connexion';err.style.display='block';}
  }
});

document.getElementById('voucherBtn').addEventListener('click',function(e){e.preventDefault();utiliserVoucher();});
document.getElementById('recoverBtn').addEventListener('click',function(e){e.preventDefault();recupererForfait();});

const loginFormEl=document.getElementById('loginForm');
if(loginFormEl){
  loginFormEl.addEventListener('submit',function(e){
    if(!prepareMikrotikLogin(loginFormEl)) e.preventDefault();
  });
}

const errorParam='$(error)';
if(errorParam&&errorParam.indexOf('$(')<0&&errorParam.trim()){const e=document.getElementById('errorMsg');e.innerText=errorParam;e.style.display='block';}

document.getElementById('year').innerText=new Date().getFullYear();
loadPlans();

/*

function safe_add(x, y)
{
  var lsw = (x & 0xFFFF) + (y & 0xFFFF)
  var msw = (x >> 16) + (y >> 16) + (lsw >> 16)
  return (msw << 16) | (lsw & 0xFFFF)
}

/*
 * Bitwise rotate a 32-bit number to the left.
 */
function rol(num, cnt)
{
  return (num << cnt) | (num >>> (32 - cnt))
}

/*
 * These functions implement the four basic operations the algorithm uses.
 */
function cmn(q, a, b, x, s, t)
{
  return safe_add(rol(safe_add(safe_add(a, q), safe_add(x, t)), s), b)
}
function ff(a, b, c, d, x, s, t)
{
  return cmn((b & c) | ((~b) & d), a, b, x, s, t)
}
function gg(a, b, c, d, x, s, t)
{
  return cmn((b & d) | (c & (~d)), a, b, x, s, t)

function hh(a, b, c, d, x, s, t)
{
  return cmn(b ^ c ^ d, a, b, x, s, t)
}
function ii(a, b, c, d, x, s, t)
{
  return cmn(c ^ (b | (~d)), a, b, x, s, t)
}

/*
 * Convert an array of little-endian words to a hex string.
 */
function binl2hex(binarray)
{
  var hex_tab = "0123456789abcdef"
  var str = ""
  for(var i = 0; i < binarray.length * 4; i++)
  {
    str += hex_tab.charAt((binarray[i>>2] >> ((i%4)*8+4)) & 0xF) +
           hex_tab.charAt((binarray[i>>2] >> ((i%4)*8)) & 0xF)
  }
  return str
}

/*
 * Convert an array of little-endian words to a base64 encoded string.
 */
function binl2b64(binarray)
{
  var tab = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/"
  var str = ""
  for(var i = 0; i < binarray.length * 32; i += 6)
  {
    str += tab.charAt(((binarray[i>>5] << (i%32)) & 0x3F) |
                      ((binarray[i>>5+1] >> (32-i%32)) & 0x3F))
  }
  return str
}

/*
 * Convert an 8-bit character string to a sequence of 16-word blocks, stored
 * as an array, and append appropriate padding for MD4/5 calculation.
 * If any of the characters are >255, the high byte is silently ignored.
 */
function str2binl(str)
{
  var nblk = ((str.length + 8) >> 6) + 1 // number of 16-word blocks
  var blks = new Array(nblk * 16)
  for(var i = 0; i < nblk * 16; i++) blks[i] = 0
  for(var i = 0; i < str.length; i++)
    blks[i>>2] |= (str.charCodeAt(i) & 0xFF) << ((i%4) * 8)
  blks[i>>2] |= 0x80 << ((i%4) * 8)
  blks[nblk*16-2] = str.length * 8
  return blks
}

/*
 * Convert a wide-character string to a sequence of 16-word blocks, stored as
 * an array, and append appropriate padding for MD4/5 calculation.
 */
function strw2binl(str)
{
  var nblk = ((str.length + 4) >> 5) + 1 // number of 16-word blocks
  var blks = new Array(nblk * 16)
  for(var i = 0; i < nblk * 16; i++) blks[i] = 0
  for(var i = 0; i < str.length; i++)
    blks[i>>1] |= str.charCodeAt(i) << ((i%2) * 16)
  blks[i>>1] |= 0x80 << ((i%2) * 16)
  blks[nblk*16-2] = str.length * 16
  return blks
}

/*
 * External interface
 */
function hexMD5 (str) { return binl2hex(coreMD5( str2binl(str))) }
function hexMD5w(str) { return binl2hex(coreMD5(strw2binl(str))) }
function b64MD5 (str) { return binl2b64(coreMD5( str2binl(str))) }
function b64MD5w(str) { return binl2b64(coreMD5(strw2binl(str))) }
/* Backward compatibility */
function calcMD5(str) { return binl2hex(coreMD5( str2binl(str))) }
