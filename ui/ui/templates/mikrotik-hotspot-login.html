<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WiFi Haut Débit</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta http-equiv="Cache-Control" content="no-cache">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0c15;font-family:system-ui,-apple-system,sans-serif;padding:20px}
.container{max-width:450px;margin:0 auto;background:linear-gradient(145deg,#0f172a,#0a0f1f);border-radius:28px;padding:24px;border:1px solid rgba(16,185,129,.2)}
.logo{text-align:center;margin-bottom:20px}
.logo h1{font-size:26px;background:linear-gradient(135deg,#34d399,#10b981);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo p{font-size:12px;color:#6b7280;margin-top:4px}
.plans{display:flex;flex-direction:column;gap:8px;margin:16px 0}
.plan{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;transition:all .2s}
.plan:hover{background:rgba(16,185,129,.1);border-color:#10b981}
.plan-name{font-weight:700;color:#facc15}
.plan-price{color:#fff;font-weight:700}
.plan-detail{font-size:11px;color:#94a3b8;margin-top:4px}
.badge{background:#10b98120;color:#6ee7b7;font-size:10px;padding:2px 8px;border-radius:20px;margin-left:8px}
.input{width:100%;padding:12px 16px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:40px;margin-bottom:10px;color:#fff;font-size:14px}
.input:focus{outline:none;border-color:#10b981}
.btn{width:100%;padding:12px;border:none;border-radius:40px;font-weight:700;cursor:pointer}
.btn-primary{background:#10b981;color:#fff}
.btn-secondary{background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.3);color:#a7f3d0;margin-bottom:12px}
.divider{display:flex;align-items:center;gap:10px;margin:16px 0;color:#4b5563;font-size:11px}
.divider-line{flex:1;height:1px;background:rgba(255,255,255,.1)}
.wa{display:flex;align-items:center;justify-content:center;gap:8px;background:rgba(37,211,102,.1);border:1px solid rgba(37,211,102,.3);border-radius:40px;padding:10px;margin-top:16px;text-decoration:none;color:#bbf7d0;font-size:13px;font-weight:600}
.wa svg{width:18px;fill:currentColor}
.footer{text-align:center;margin-top:20px;font-size:10px;color:#4b5563}
.error{color:#f87171;font-size:12px;margin-top:8px;display:none}
</style>
</head>
<body>
<div class="container">
<div class="logo">
<h1><span data-hotspot-title>⚡ WiFi PRO</span></h1>
<p data-hotspot-tagline>Haut débit • Illimité</p>
</div>

<a href="https://wa.me/33761951914" target="_blank" class="wa">
<svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347z"/></svg>
<span>WhatsApp Assistance</span>
</a>

<div class="plans" id="plansList">
<div style="text-align:center;padding:12px;color:#6b7280">⏳ Chargement...</div>
</div>

<div class="divider"><div class="divider-line"></div><span>Accès compte</span><div class="divider-line"></div></div>

<form action="$(link-login-only)" method="post" id="loginForm">
<input type="hidden" name="dst" value="$(link-orig)">
<input type="text" name="username" id="user" class="input" placeholder="Identifiant">
<input type="password" name="password" id="pass" class="input" placeholder="Mot de passe">
<button type="button" id="loginBtn" class="btn btn-primary">🔓 Se connecter</button>
<div id="errorMsg" class="error"></div>
</form>

<div class="footer">© <span id="year"></span> Dyrsia • <a href="https://wifizones.org/" target="_blank" style="color:#6ee7b7">wifizones.org</a></div>
</div>

<script>
window.HOTSPOT_INLINE_MD5=true;
const APP_URL = "http:\/\/10.0.0.2:8080";
const HOTSPOT_ROUTER_NAME = "$(identity)";
const HOTSPOT_EMBEDDED_PLANS = [];
const HOTSPOT_DNS_NAME = "";
const HOTSPOT_PAYMENT_GATEWAY = "campay";
let CLIENT_MAC = '';
(function(){const m='$(mac)';if(/^([0-9A-Fa-f]{2}[:\-]){5}[0-9A-Fa-f]{2}$/i.test(m))CLIENT_MAC=m.toUpperCase();})();

function escHtml(s){return String(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}

async function api(route,opts){
  const base=(APP_URL||'').replace(/\/$/,'');
  const bases=[];
  if(base)bases.push(base);
  // Repli proxy local (VPN) uniquement si APP_URL échoue.
  try{const h=new URL(window.location.origin).hostname;if(/^(10\.|192\.168\.)/.test(h)){const proxy='http://'+h+':8080';if(!bases.includes(proxy))bases.push(proxy);}}catch(e){}
  let last;
  for(const b of[...new Set(bases)]){
    try{
      const r=await fetch(b+'/index.php?_route=plugin/'+route,opts);
      if(r.ok||(r.headers.get('content-type')||'').toLowerCase().includes('json'))return r;
      last=new Error('HTTP '+r.status+' via '+b);
    }catch(e){last=e;}
  }
  throw last||new Error('API injoignable');
}

function renderPlans(plans){
  const c=document.getElementById('plansList');
  if(!plans||!plans.length){c.innerHTML='<div style="text-align:center;color:#f87171">Aucun forfait disponible</div>';return;}
  const rn=HOTSPOT_ROUTER_NAME;
  c.innerHTML=plans.map(p=>{
    const id=p.planid||'';
    const link=p.paymentlink||(APP_URL+'/index.php?_route=plugin/hotspot_pay&routername='+encodeURIComponent(rn)+'&planid='+encodeURIComponent(id)+'&amount='+encodeURIComponent(p.price||''));
    return`<div class="plan" data-plan-name="${escHtml(p.planname||p.name||'')}" data-plan-price="${escHtml(p.price||'')}" data-plan-currency="${escHtml(p.currency||'Fcfa')}" data-plan-validity="${escHtml(p.validity||'')}" data-plan-id="${escHtml(id)}" data-router-name="${escHtml(rn)}"><div><div class="plan-name">⚡ ${escHtml(p.planname||p.name||'')}</div><div class="plan-detail">⏱️ ${escHtml(p.validity||'')}</div></div><div><span class="plan-price">${escHtml(p.price||'')} ${escHtml(p.currency||'Fcfa')}</span><span class="badge">ILLIMITÉ</span></div></div>`;
  }).join('');

  // Add click handlers via event delegation
  c.querySelectorAll('.plan').forEach(el=>{
    el.addEventListener('click',()=>{
      const nom=el.dataset.planName;
      const prix=el.dataset.planPrice;
      const currency=el.dataset.planCurrency;
      const validite=el.dataset.planValidity;
      const planid=el.dataset.planId;
      const routername=el.dataset.routerName;
      payer(nom,prix,currency,validite,planid,routername);
    });
  });
}

async function loadPlans(){
  const c=document.getElementById('plansList');
  if(HOTSPOT_EMBEDDED_PLANS&&HOTSPOT_EMBEDDED_PLANS.length){renderPlans(HOTSPOT_EMBEDDED_PLANS);return;}
  c.innerHTML='<div style="text-align:center;padding:12px;color:#6b7280">⏳ Chargement...</div>';
  try{
    const r=await api('hotspot_plan',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'routername='+encodeURIComponent(HOTSPOT_ROUTER_NAME)});
    const d=await r.json();
    if(d.data&&d.data.length)renderPlans(d.data);
    else c.innerHTML='<div style="text-align:center;color:#f87171">'+(d.message||'Aucun forfait disponible')+'</div>';
  }catch(e){c.innerHTML='<div style="text-align:center;color:#f87171">⚠️ API injoignable</div>';}
}

async function poll(ref,max){
  const dl=Date.now()+max*1000;
  while(Date.now()<dl){
    await new Promise(r=>setTimeout(r,3000));
    try{const r=await api('hotspot_verify&reference='+encodeURIComponent(ref)+'&format=json',{headers:{Accept:'application/json'}});
    const d=await r.json();if(['paid','failed','cancelled'].includes(d.status))return d;}catch(e){}
  }
  return{status:'timeout',message:'Délai dépassé. Vérifiez votre téléphone.'};
}

function connecter(user,pass,nom){
  Swal.fire({html:'<b>✅ '+escHtml(nom)+'</b><br>Connexion en cours…',showConfirmButton:false,timer:1800});
  setTimeout(()=>{
    const f=document.getElementById('loginForm');
    document.getElementById('user').value=user||'';
    document.getElementById('pass').value=pass||user||'';
    if(f&&typeof prepareMikrotikLogin==='function')prepareMikrotikLogin(f);
    if(f)f.submit();
  },1500);
}

async function payer(nom,prix,currency,validite,planid,routername){
  const {value:phone}=await Swal.fire({title:`💰 ${nom} — ${prix} ${currency||'Fcfa'}`,text:'Numéro Mobile Money (9 chiffres)',input:'tel',inputPlaceholder:'677123456',inputAttributes:{maxlength:9,inputmode:'numeric',pattern:'[0-9]*',autocomplete:'off'},showCancelButton:true,confirmButtonText:'Payer',cancelButtonText:'Annuler',didOpen:()=>{const el=Swal.getInput();if(el)el.addEventListener('input',()=>{el.value=el.value.replace(/\D/g,'').slice(0,9);});},inputValidator:v=>{const c=(v||'').replace(/\D/g,'');return c.length!==9?'9 chiffres requis (ex: 677123456)':null;}});
  if(!phone)return;
  try{
    const msisdn='237'+phone.replace(/\D/g,'');
    const body=new URLSearchParams({pay:'1',type:'gateways',payment_gateway:HOTSPOT_PAYMENT_GATEWAY,routername:routername||HOTSPOT_ROUTER_NAME,planid,amount:prix,plan_name:nom,mac_address:CLIENT_MAC||'$(mac)',ip_address:'$(ip)',msisdn,phonenumber:msisdn,ajax:'1'});
    const r=await api('hotspot_pay',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded','X-Requested-With':'XMLHttpRequest'},body:body.toString()});
    const d=await r.json();
    if(!d.ok){Swal.fire('Refusé',d.message||'Erreur paiement','error');return;}
    Swal.fire({title:'Validez sur votre téléphone',html:'📱 Composez: <b style="color:#10b981;font-size:1.4em">'+(d.ussd_code||'*126#')+'</b><br><small>Ne fermez pas cette page</small>',allowOutsideClick:false,showConfirmButton:false});
    const res=await poll(d.reference,60);
    Swal.close();
    if(res.status==='paid')connecter(res.voucher_code||res.username,res.password||'123456',nom);
    else if(res.status==='failed')Swal.fire('Échec',res.message||'Transaction refusée','error');
    else Swal.fire('En attente','Confirmation non reçue. Si validé, attendez 1 minute.','warning');
  }catch(e){Swal.fire('Erreur réseau',e.message||'Impossible de contacter le serveur','error');}
}

async function utiliserVoucher(){
  const {value:code}=await Swal.fire({title:'🎫 Code voucher',input:'text',inputPlaceholder:'XXXX-XXXX-XXXX',showCancelButton:true,confirmButtonText:'Valider',cancelButtonText:'Annuler',inputValidator:v=>(!v||!v.trim())?'Saisissez votre code':null});
  if(!code||!code.trim())return;
  try{
    const r=await api('hotspot_voucher_check',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'voucher='+encodeURIComponent(code.trim())});
    const d=await r.json();
    if(d.success)connecter(d.username,d.password||d.username,'Voucher');
    else Swal.fire('Invalide',d.message||'Code incorrect','error');
  }catch(e){Swal.fire('Erreur réseau',e.message,'error');}
}

async function recupererForfait(){
  const {value:phone}=await Swal.fire({title:'🔑 Récupérer mon forfait',input:'tel',inputPlaceholder:'677123456',inputAttributes:{maxlength:9,inputmode:'numeric',pattern:'[0-9]*',autocomplete:'off'},showCancelButton:true,confirmButtonText:'Rechercher',didOpen:()=>{const el=Swal.getInput();if(el)el.addEventListener('input',()=>{el.value=el.value.replace(/\D/g,'').slice(0,9);});},inputValidator:v=>(v||'').replace(/\D/g,'').length!==9?'9 chiffres requis':null});
  if(!phone)return;
  try{
    const r=await api('hotspot_recover_plan',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'phone='+encodeURIComponent(phone.replace(/\D/g,''))});
    const d=await r.json();
    if(d.success)connecter(d.username,d.password||d.username,'Forfait récupéré');
    else Swal.fire('Non trouvé',d.message||'Aucun forfait actif','error');
  }catch(e){Swal.fire('Erreur réseau',e.message,'error');}
}

document.getElementById('loginBtn').addEventListener('click',async()=>{
  const u=document.getElementById('user').value.trim();
  const p=document.getElementById('pass').value.trim();
  const err=document.getElementById('errorMsg');
  if(!u||!p){err.innerText='Identifiant et mot de passe requis';err.style.display='block';return;}
  err.style.display='none';
  try{
    const r=await api('hotspot_account_check',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'username='+encodeURIComponent(u)+'&password='+encodeURIComponent(p)});
    const d=await r.json();
    if(d.success)connecter(d.username,d.password||p,'Connexion');
    else{err.innerText=d.message||'Identifiants incorrects';err.style.display='block';}
  }catch(e){
    const f=document.getElementById('loginForm');
    if(f&&f.action.indexOf('$(link-login-only)')<0){if(typeof prepareMikrotikLogin==='function')prepareMikrotikLogin(f);f.submit();}
    else{err.innerText='Erreur de connexion';err.style.display='block';}
  }
});

const voucherBtn=document.createElement('button');
voucherBtn.className='btn btn-secondary';
voucherBtn.style.marginBottom='10px';
voucherBtn.textContent='🎫 J\'ai un code';
voucherBtn.addEventListener('click',utiliserVoucher);

const recoverBtn=document.createElement('button');
recoverBtn.className='btn btn-secondary';
recoverBtn.style.marginBottom='10px';
recoverBtn.textContent='🔑 Récupérer mon forfait';
recoverBtn.addEventListener('click',recupererForfait);

document.querySelector('#loginForm').insertAdjacentElement('afterbegin',recoverBtn);
document.querySelector('#loginForm').insertAdjacentElement('afterbegin',voucherBtn);

const errorParam='$(error)';
if(errorParam&&errorParam.indexOf('$(')<0&&errorParam.trim()){const e=document.getElementById('errorMsg');e.innerText=errorParam;e.style.display='block';}

document.getElementById('year').innerText=new Date().getFullYear();
loadPlans();

// Chap pour MikroTik

function fetchHotspotEndpoint(r,o){return api(r,o)}
/* Login en clair (le hotspot doit avoir login-by=http-pap). On ne hash plus
   le mot de passe : la fonction MD5 inline était corrompue par la minification
   et f.submit() ne déclenche pas l'event 'submit' de toute façon. */
</script>
