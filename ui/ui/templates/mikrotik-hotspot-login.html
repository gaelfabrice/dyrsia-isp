<style>
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:#0a0c15;font-family:system-ui,-apple-system,sans-serif;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:clamp(10px,3vw,24px);padding-top:calc(clamp(10px,3vw,24px) + env(safe-area-inset-top,0px));padding-bottom:calc(clamp(10px,3vw,24px) + env(safe-area-inset-bottom,0px));padding-left:calc(clamp(10px,3vw,24px) + env(safe-area-inset-left,0px));padding-right:calc(clamp(10px,3vw,24px) + env(safe-area-inset-right,0px))}
.container{width:100%;max-width:450px;margin:0 auto;background:linear-gradient(145deg,#0f172a,#0a0f1f);border-radius:clamp(18px,4vw,28px);padding:clamp(14px,4vw,24px);border:1px solid rgba(16,185,129,.2)}
.logo{text-align:center;margin-bottom:clamp(12px,3vw,20px)}
.logo h1{font-size:clamp(20px,5.5vw,26px);background:linear-gradient(135deg,#34d399,#10b981);-webkit-background-clip:text;background-clip:text;color:transparent;word-break:break-word}
.logo p{font-size:clamp(11px,3vw,12px);color:#6b7280;margin-top:4px}
.plans-section-title{font-size:clamp(13px,3.8vw,15px);font-weight:700;color:#facc15;margin:16px 0 10px;text-align:center;letter-spacing:.02em}
.plans{display:flex;flex-direction:column;gap:8px;margin:0 0 16px}
.plan{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:clamp(10px,2.5vw,12px) clamp(12px,3.5vw,16px);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;cursor:pointer;transition:all .2s;touch-action:manipulation;-webkit-tap-highlight-color:rgba(16,185,129,.25);user-select:none;min-height:44px}
.plan:hover{background:rgba(16,185,129,.1);border-color:#10b981}
.plan>div{min-width:0}
.plan>div:last-child{display:flex;align-items:center;flex-wrap:wrap;justify-content:flex-end;gap:4px;margin-left:auto}
.plan-name{font-weight:700;color:#facc15;font-size:clamp(13px,3.8vw,15px);word-break:break-word}
.plan-price{color:#fff;font-weight:700;font-size:clamp(13px,3.8vw,15px);white-space:nowrap}

.btn-secondary{background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.3);color:#a7f3d0;margin-bottom:12px}
.divider{display:flex;align-items:center;gap:10px;margin:16px 0;color:#4b5563;font-size:11px}
.divider-line{flex:1;height:1px;background:rgba(255,255,255,.1)}
.contact{display:flex;align-items:center;justify-content:center;gap:8px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:40px;padding:10px;margin:12px 0 4px;text-decoration:none;color:#e5e7eb;font-size:clamp(12px,3.5vw,13px);font-weight:600;min-height:44px}
.contact svg{width:18px;height:18px;fill:currentColor;flex-shrink:0}
.contact:hover{background:rgba(16,185,129,.12);border-color:rgba(16,185,129,.35);color:#a7f3d0}
.footer{text-align:center;margin-top:clamp(12px,3vw,20px);font-size:10px;color:#4b5563}
.error{color:#f87171;font-size:12px;margin-top:8px;display:none}
.btn,.plan,.contact{position:relative;z-index:2;pointer-events:auto;-webkit-user-select:none;user-select:none}
.hs-modal{display:none;position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,.55);align-items:center;justify-content:center;padding:clamp(12px,4vw,20px);padding-bottom:calc(clamp(12px,4vw,20px) + env(safe-area-inset-bottom,0px));overflow-y:auto;-webkit-overflow-scrolling:touch}
.hs-modal.open{display:flex}
.hs-modal-box{width:100%;max-width:360px;max-height:90vh;max-height:90dvh;overflow-y:auto;background:#0f172a;border:1px solid rgba(16,185,129,.35);border-radius:20px;padding:clamp(14px,4vw,18px);color:#e5e7eb;margin:auto}
.hs-modal-box h3{margin:0 0 8px;font-size:clamp(15px,4vw,16px);color:#f8fafc}
.hs-modal-box p{margin:0 0 12px;font-size:13px;color:#94a3b8;line-height:1.4}
.hs-modal-box .input{margin-bottom:12px}
.hs-modal-actions{display:flex;gap:8px}
.hs-modal-actions .btn{flex:1}
.hs-modal-box.hs-modal-pay{background:#fff;color:#0f172a;border-color:#e2e8f0;box-shadow:0 20px 50px rgba(15,23,42,.25)}
.hs-modal-box.hs-modal-pay h3{color:#111827}
.hs-modal-box.hs-modal-pay p{color:#64748b}
.hs-modal-box.hs-modal-pay .input{background:#fff;border-color:#cbd5e1;color:#111827;margin-bottom:12px}
.hs-modal-box.hs-modal-pay .btn-primary{background:linear-gradient(135deg,#7c3aed,#6d28d9);color:#fff}
.hs-modal-box.hs-modal-pay .btn-secondary{background:#f1f5f9;border:1px solid #e2e8f0;color:#475569}
.hs-modal-box.hs-modal-wait,.hs-modal-box.hs-modal-ussd{text-align:center}
.hs-modal-spinner{display:none;width:38px;height:38px;border:3px solid rgba(16,185,129,.2);border-top-color:#10b981;border-radius:50%;animation:hsSpin .75s linear infinite;margin:14px auto 6px}
.hs-modal-box.hs-modal-wait .hs-modal-spinner{display:block}
.hs-ussd-code{font-size:clamp(26px,7vw,34px);font-weight:800;color:#34d399;text-align:center;margin:10px 0 6px;letter-spacing:.05em;word-break:break-word}
.hs-ussd-hint{font-size:13px;color:#94a3b8;line-height:1.45;margin:0}
.hs-modal-error{color:#ef4444!important;font-size:12px;margin:-4px 0 10px!important}
#hsModalHtml:empty{display:none}
@keyframes hsSpin{to{transform:rotate(360deg)}}
@media (min-width:768px){
.container{max-width:480px;padding:28px 32px}
}
@media (max-width:340px){
.badge{display:none}

}
@media (max-height:520px) and (orientation:landscape){
body{padding-top:10px;padding-bottom:10px}

.logo h1{font-size:20px}
.plans-section-title{margin:10px 0 8px}
.divider{margin:10px 0}
}
</style>

<script>
window.HOTSPOT_INLINE_MD5=true;
const APP_URL = "";
const HOTSPOT_PROXY_PORT = 8080;
const HOTSPOT_BACKEND_URL = "";
const HOTSPOT_ROUTER_NAME = "";
const HOTSPOT_EMBEDDED_PLANS = [];
const HOTSPOT_DNS_NAME = "";
const HOTSPOT_PAYMENT_GATEWAY = "campay";
function mkField(id){
  var el=document.getElementById(id);
  return el ? String(el.value || el.textContent || '').replace(/^\s+|\s+$/g,'') : '';
}
function hotspotRouterName(){
  var n=String(typeof HOTSPOT_ROUTER_NAME!=='undefined'?HOTSPOT_ROUTER_NAME:'');
  if(!n || n.indexOf('$(')===0) n=mkField('mk-identity');
  // Pas de fallback vers un autre routeur (évite les forfaits d'une autre instance).
  return n || '';
}
function hotspotPaymentRouterName(fallback){
  var value=String(fallback||'').trim();
  if(value && value.indexOf('$(')!==0 && value.toLowerCase()!=='hp') return value;
  var cfg=String(typeof HOTSPOT_ROUTER_NAME!=='undefined'?HOTSPOT_ROUTER_NAME:'').trim();
  if(cfg && cfg.indexOf('$(')!==0 && cfg.toLowerCase()!=='hp') return cfg;
  if(typeof HOTSPOT_EMBEDDED_PLANS!=='undefined'&&HOTSPOT_EMBEDDED_PLANS&&HOTSPOT_EMBEDDED_PLANS.length){
    var embeddedRouter=String(HOTSPOT_EMBEDDED_PLANS[0].routerName||HOTSPOT_EMBEDDED_PLANS[0].routername||'').trim();
    if(embeddedRouter && embeddedRouter.indexOf('$(')!==0) return embeddedRouter;
  }
  return '';
}
let CLIENT_MAC = '';
(function(){
  var m=mkField('mk-mac');
  if(/^([0-9A-Fa-f]{2}[:\-]){5}[0-9A-Fa-f]{2}$/i.test(m))CLIENT_MAC=m.toUpperCase();
})();

function hotspotModalElements(){
  return{
    modal:document.getElementById('hsModal'),
    box:document.querySelector('#hsModal .hs-modal-box'),
    title:document.getElementById('hsModalTitle'),
    text:document.getElementById('hsModalText'),
    html:document.getElementById('hsModalHtml'),
    spinner:document.getElementById('hsModalSpinner'),
    input:document.getElementById('hsModalInput'),
    actions:document.getElementById('hsModalActions'),
    ok:document.getElementById('hsModalOk'),
    cancel:document.getElementById('hsModalCancel')
  };
}
var hsModalTimer=null;
function hotspotModalClose(){
  clearTimeout(hsModalTimer);
  hsModalTimer=null;
  var els=hotspotModalElements();
  if(els.modal){
    els.modal.classList.remove('open');
    els.modal.setAttribute('aria-hidden','true');
  }
  if(els.box){
    els.box.classList.remove('hs-modal-pay','hs-modal-wait','hs-modal-ussd');
  }
}
function hotspotModalShowValidation(els,message){
  if(!els.text)return;
  if(message){
    els.text.textContent=String(message);
    els.text.classList.add('hs-modal-error');
  }else{
    els.text.classList.remove('hs-modal-error');
  }
}
function hotspotModalFire(opts){
  opts=opts||{};
  var els=hotspotModalElements();
  if(!els.modal||!els.box||!els.input||!els.ok||!els.cancel){
    return Promise.resolve({isConfirmed:false,isDismissed:true,value:null});
  }
  return new Promise(function(resolve){
    clearTimeout(hsModalTimer);
    hsModalTimer=null;
    els.box.classList.remove('hs-modal-pay','hs-modal-wait','hs-modal-ussd');
    if(els.html)els.html.innerHTML='';
    if(els.spinner)els.spinner.style.display='none';
    els.text.classList.remove('hs-modal-error');
    els.ok.onclick=null;
    els.cancel.onclick=null;
    els.input.onkeydown=null;

    function finish(result){
      els.ok.onclick=null;
      els.cancel.onclick=null;
      els.input.onkeydown=null;
      hotspotModalClose();
      resolve(result);
    }

    if(opts.input){
      els.box.classList.add('hs-modal-pay');
      els.title.textContent=opts.title||'';
      els.text.textContent=opts.text||'';
      if(els.html)els.html.innerHTML='';
      els.input.style.display='block';
      els.input.type=opts.input==='tel'?'tel':String(opts.input||'text');
      els.input.placeholder=opts.inputPlaceholder||'';
      els.input.value=opts.inputValue||'';
      if(opts.inputAttributes){
        Object.keys(opts.inputAttributes).forEach(function(key){
          els.input.setAttribute(key,opts.inputAttributes[key]);
        });
      }
      if(els.actions)els.actions.style.display='flex';
      els.ok.textContent=opts.confirmButtonText||'OK';
      els.cancel.textContent=opts.cancelButtonText||'Annuler';
      els.cancel.style.display=opts.showCancelButton===false?'none':'';
      els.modal.classList.add('open');
      els.modal.setAttribute('aria-hidden','false');
      setTimeout(function(){try{els.input.focus();}catch(e){}},50);
      if(typeof opts.didOpen==='function'){
        try{opts.didOpen();}catch(e){}
      }
      els.cancel.onclick=function(){finish({isConfirmed:false,isDismissed:true,value:null});};
      els.ok.onclick=function(){
        var raw=els.input.value;
        if(typeof opts.inputValidator==='function'){
          var err=opts.inputValidator(raw);
          if(err){hotspotModalShowValidation(els,err);return;}
        }
        finish({isConfirmed:true,value:raw});
      };
      els.input.onkeydown=function(ev){
        if(ev.key==='Enter'){
          ev.preventDefault();
          els.ok.click();
        }
      };
      return;
    }

    els.input.style.display='none';
    els.title.textContent=opts.title||'';
    els.text.textContent=opts.text||'';
    if(els.html){
      if(opts.html){
        els.html.innerHTML=String(opts.html);
      }else{
        els.html.innerHTML='';
      }
    }

    var waiting=opts.showConfirmButton===false;
    if(opts.modalTheme==='ussd'){
      els.box.classList.add('hs-modal-ussd');
    }else if(waiting){
      els.box.classList.add('hs-modal-wait');
      if(els.spinner&&!opts.html)els.spinner.style.display='block';
    }

    if(els.actions)els.actions.style.display=waiting?'none':'flex';
    els.ok.textContent=opts.confirmButtonText||'OK';
    els.cancel.style.display='none';
    els.modal.classList.add('open');
    els.modal.setAttribute('aria-hidden','false');

    if(opts.timer&&opts.timer>0){
      hsModalTimer=setTimeout(function(){finish({isConfirmed:true});},opts.timer);
      return;
    }
    if(waiting){
      resolve({isConfirmed:true});
      return;
    }
    els.ok.onclick=function(){finish({isConfirmed:true});};
  });
}

function hotspotSwal(){
  return{
    fire:function(opts){
      if(typeof opts==='string'){
        return hotspotModalFire({title:opts,text:arguments[1]||'',confirmButtonText:'OK'});
      }
      return hotspotModalFire(opts||{});
    },
    close:hotspotModalClose,
    getInput:function(){return document.getElementById('hsModalInput');}
  };
}
function escHtml(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

const HOTSPOT_PHONE_LEN = 9;
function cleanHotspotPhone(value) {
  return String(value || '').replace(/\D/g, '').slice(0, HOTSPOT_PHONE_LEN);
}
function validateHotspotPhoneLen(value) {
  return cleanHotspotPhone(value).length === HOTSPOT_PHONE_LEN ? null : '9 chiffres obligatoires (ex: 677123456)';
}
function hotspotPhoneInputAttrs() {
  return { maxlength: HOTSPOT_PHONE_LEN, minlength: HOTSPOT_PHONE_LEN, inputmode: 'numeric', pattern: '[0-9]*', autocomplete: 'off' };
}
function bindHotspotPhoneField(el) {
  if (!el) return;
  const trim = () => { el.value = cleanHotspotPhone(el.value); };
  el.addEventListener('input', trim);
  el.addEventListener('paste', (e) => {
    e.preventDefault();
    el.value = cleanHotspotPhone((e.clipboardData || window.clipboardData).getData('text'));
  });
}

function apiRouteUrl(base,route){
  let routePath=route;
  let extraQuery='';
  const amp=route.indexOf('&');
  if(amp>=0){routePath=route.slice(0,amp);extraQuery='&'+route.slice(amp+1);}
  return String(base||'').replace(/\/$/,'')+'/index.php?_route=plugin/'+routePath+extraQuery;
}

function encodeForm(data){
  if(typeof URLSearchParams!=='undefined'){
    try{return new URLSearchParams(data).toString();}catch(e){}
  }
  return Object.keys(data||{}).map(function(k){
    return encodeURIComponent(k)+'='+encodeURIComponent(data[k]==null?'':data[k]);
  }).join('&');
}

async function parseApiJson(r){
  const ct=(r.headers.get('content-type')||'').toLowerCase();
  const raw=await r.text();
  const trimmed=raw.trim();
  if(ct.includes('json')||trimmed.startsWith('{')||trimmed.startsWith('[')){
    try{return JSON.parse(trimmed||'{}');}catch(e){throw new Error('Réponse JSON invalide du serveur');}
  }
  if(trimmed.startsWith('<'))throw new Error('Le serveur a renvoyé une page HTML au lieu de JSON — vérifiez Hotspot API URL / proxy :8080');
  throw new Error(trimmed.slice(0,120)||('HTTP '+r.status));
}

async function fetchWithTimeout(url,opts,ms){
  opts=opts||{};
  ms=ms||25000;
  if(typeof AbortController==='undefined'){
    return fetch(url,opts);
  }
  const ctrl=new AbortController();
  const t=setTimeout(function(){try{ctrl.abort();}catch(e){}},ms);
  try{
    return await fetch(url,Object.assign({},opts,{signal:ctrl.signal}));
  }finally{
    clearTimeout(t);
  }
}

async function api(route,opts){
  const bases=hotspotApiBases();
  const timeoutMs=(route.indexOf('hotspot_pay')>=0||route.indexOf('hotspot_verify')>=0)?60000:30000;
  let last;
  for(const b of bases){
    try{
      const r=await fetchWithTimeout(apiRouteUrl(b,route),opts,timeoutMs);
      const ct=(r.headers.get('content-type')||'').toLowerCase();
      if(r.ok&&ct.includes('json'))return r;
      if(r.ok){
        const peek=await r.clone().text();
        if(peek.trim().startsWith('{')||peek.trim().startsWith('['))return r;
        last=new Error('Réponse HTML inattendue via '+b);
        continue;
      }
      if(ct.includes('json')||(r.status>=400&&r.status<500))return r;
      last=new Error('HTTP '+r.status+' via '+b);
    }catch(e){last=e&&e.name==='AbortError'?new Error('Délai dépassé via '+b):(e||new Error('échec '+b));}
  }
  throw last||new Error('API injoignable ('+bases.join(' | ')+')');
}

function hotspotApiBases(){
  const bases=[];
  const appBase=(APP_URL||'').replace(/\/$/,'');
  if(appBase&&!bases.includes(appBase))bases.push(appBase);
  let routerHost='';
  let onCaptive=false;
  try{
    const origin=window.location.origin||'';
    if(/^https?:/.test(origin)){
      routerHost=new URL(origin).hostname;
      onCaptive=/^(10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.)/.test(routerHost);
    }
  }catch(e){}
  if(/localhost|127\.0\.0\.1|:8082/i.test(window.location.origin||'')){
    const local=window.location.origin.replace(/\/$/,'');
    if(local&&!bases.includes(local))bases.unshift(local);
  }
  const proxyPort=(typeof HOTSPOT_PROXY_PORT!=='undefined'&&HOTSPOT_PROXY_PORT)?Number(HOTSPOT_PROXY_PORT):8080;
  if(onCaptive&&routerHost){
    const proxy='http://'+routerHost+(proxyPort===80?'':(':'+proxyPort));
    if(proxy&&!bases.includes(proxy))bases.push(proxy);
  }
  const backendBase=(typeof HOTSPOT_BACKEND_URL!=='undefined'?HOTSPOT_BACKEND_URL:'').replace(/\/$/,'');
  if(backendBase&&!bases.includes(backendBase))bases.push(backendBase);
  return [...new Set(bases.filter(Boolean))];
}

function plansMatchRouter(plans,routerName){
  if(!plans||!plans.length)return false;
  routerName=String(routerName||'').trim().toLowerCase();
  if(!routerName)return true;
  return plans.every(function(p){
    const r=String(p.routerName||p.routername||'').trim().toLowerCase();

function isLocalHotspotApiBase(base){
  try{
    const u=new URL(base);
    const host=u.hostname;
    if(/^(10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.|127\.0\.0\.1|localhost)/.test(host))return true;
    const pageHost=(window.location.hostname||'').toLowerCase();
    return pageHost!==''&&host.toLowerCase()===pageHost;
  }catch(e){}
  return false;
}

async function loadPlans(){
  const c=document.getElementById('plansList');
  if(!c)return;
  bindPlanClicks();
  const hadPlans=c.querySelector('.plan[data-plan-id]');
  if(!hadPlans){
    c.dataset.plansReady='0';
    c.innerHTML='<div style="text-align:center;padding:12px;color:#6b7280">⏳ Chargement...</div>';
  }
  const routerName=hotspotRouterName();
  const hasEmbedded=HOTSPOT_EMBEDDED_PLANS&&HOTSPOT_EMBEDDED_PLANS.length&&plansMatchRouter(HOTSPOT_EMBEDDED_PLANS,routerName);
  // Forfaits embarqués au déploiement = source de vérité (évite les forfaits d'un autre routeur via API prod/proxy).
  if(hasEmbedded){renderPlans(HOTSPOT_EMBEDDED_PLANS);return;}
  let remotePlans=null;
  for(const b of hotspotApiBases()){
    try{
      const r=await fetch(apiRouteUrl(b,'hotspot_plan'),{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'routername='+encodeURIComponent(routerName)});
      const d=await r.json();
      if(!d.data||!d.data.length||!plansMatchRouter(d.data,routerName))continue;
      remotePlans=d.data;
      if(isLocalHotspotApiBase(b)){renderPlans(d.data);return;}
    }catch(e){}
  }
  if(remotePlans){renderPlans(remotePlans);return;}
  c.innerHTML='<div style="text-align:center;color:#f87171">Aucun forfait disponible</div>';
  c.dataset.plansReady='1';
}

async function poll(ref,max){
  const dl=Date.now()+max*1000;
  const pollStartDelay=10000;
  await new Promise(r=>setTimeout(r,pollStartDelay));
  while(Date.now()<dl){
    try{const r=await api('hotspot_verify&reference='+encodeURIComponent(ref)+'&format=json',{headers:{Accept:'application/json'}});
    const d=await r.json();if(['paid','failed','cancelled'].includes(d.status))return d;}catch(e){}
    await new Promise(r=>setTimeout(r,3000));
  }
  return{status:'timeout',message:'Délai dépassé. Vérifiez votre téléphone.'};
}

function normalizeHotspotPlainPassword(value) {
  var p = String(value || '').replace(/^\s+|\s+$/g, '');
  if (!p || p.indexOf('$2y$') === 0 || p.indexOf('$2a$') === 0 || p.indexOf('$2b$') === 0) return '123456';
  if (/^[a-f0-9]{32}$/i.test(p)) return '123456';
  return p;
}

function prepareMikrotikLogin(form) {
  if (!form) return false;
  const passwordInput = form.querySelector('input[name="password"]');
  if (passwordInput) {
    // PAP uniquement : mot de passe clair (pas de CHAP / MD5).
    passwordInput.value = normalizeHotspotPlainPassword(passwordInput.value);
    delete passwordInput.dataset.chapDone;
  }
  return true;
}

function submitHotspotLogin() {
  const f = document.getElementById('loginForm');
  if (!f || f.dataset.authBusy === '1') return;
  f.dataset.authBusy = '1';
  if (!prepareMikrotikLogin(f)) {
    f.dataset.authBusy = '0';
    return;
  }
  try { f.submit(); } catch (e) { f.dataset.authBusy = '0'; }
}

function fillAndSubmitHotspotLogin(username, password) {

  if (!form || form.dataset.authBusy === '1') return;
  const userEl = document.getElementById('user') || document.getElementById('loginUsername');
  const passEl = document.getElementById('pass') || document.getElementById('loginPassword');
  if (userEl) userEl.value = username || '';

    passEl.value = normalizeHotspotPlainPassword(password || '123456');

  if (typeof hotspotModalClose === 'function') hotspotModalClose();
  submitHotspotLogin();

function normalizeHotspotLoginPassword(p){
  p=String(p||'').trim();

  if(!p||p.indexOf('$2y$')===0||p.indexOf('$2a$')===0||p.indexOf('$2b$')===0)return '123456';
  if(/^[a-f0-9]{32}$/i.test(p))return '123456';

}

async function payer(nom,prix,currency,validite,planid,routername){
  const SwalUi=hotspotSwal();
  planid=String(planid||'').trim();
  routername=hotspotPaymentRouterName(routername);
  if(!planid){SwalUi.fire('Erreur','Forfait invalide (identifiant manquant). Rechargez la page.','error');return;}
  if(!routername){SwalUi.fire('Erreur','Routeur hotspot non configuré. Renvoyez login.html depuis Settings → Hotspot.','error');return;}
  const phoneResult=await SwalUi.fire({title:'💰 '+(nom||'')+' — '+(prix||'')+' '+(currency||'Fcfa'),text:'Numéro Mobile Money (9 chiffres obligatoires)',input:'tel',inputPlaceholder:'677123456',inputAttributes:hotspotPhoneInputAttrs(),showCancelButton:true,confirmButtonText:'Payer',cancelButtonText:'Annuler',didOpen:function(){bindHotspotPhoneField(SwalUi.getInput&&SwalUi.getInput());},inputValidator:validateHotspotPhoneLen});
  if(!phoneResult||phoneResult.isDismissed||phoneResult.isConfirmed===false)return;
  const phone=phoneResult.value;
  if(!phone)return;
  const msisdn='237'+cleanHotspotPhone(phone);
  const body=encodeForm({
    pay:'1',
    type:'gateways',
    payment_gateway:HOTSPOT_PAYMENT_GATEWAY||'campay',
    routername:routername,
    planid:planid,
    amount:String(prix||''),
    plan_name:nom||'',
    mac_address:CLIENT_MAC||mkField('mk-mac')||'22:12:59:0C:45:58',
    ip_address:mkField('mk-ip')||'0.0.0.0',
    msisdn:msisdn,
    phonenumber:msisdn,
    ajax:'1'
  });
  try{
    hotspotModalClose();
    SwalUi.fire({title:'Paiement en cours…',text:'Contact du serveur Mobile Money…',showConfirmButton:false});
    const r=await api('hotspot_pay&ajax=1&pay=1',{
      method:'POST',
      headers:{
        'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8',
        'Accept':'application/json'
      },
      body:body
    });
    const d=await parseApiJson(r);
    if(!d.ok){SwalUi.fire('Refusé',d.message||'Erreur paiement','error');return;}
    const ussd=d.ussd_code||'*126#';
    await SwalUi.fire({
      title:'Validez sur votre téléphone',
      html:'<div class="hs-ussd-code">'+escHtml(ussd)+'</div><p class="hs-ussd-hint">Validez la demande Mobile Money sur votre téléphone.<br><small>Ne fermez pas cette page.</small></p>',
      modalTheme:'ussd',
      showConfirmButton:false,
      allowOutsideClick:false,
      allowEscapeKey:false
    });
    const res=await poll(d.reference,120);
    SwalUi.close();
    await new Promise(r=>setTimeout(r,150));
    if(res.status==='paid')connecter(res.voucher_code||res.username,'123456',nom);
    else if(res.status==='failed')SwalUi.fire('Échec',res.message||'Transaction refusée','error');
    else SwalUi.fire('En attente','Confirmation non reçue. Si validé, attendez 1 minute.','warning');
  }catch(e){
    SwalUi.fire('Erreur réseau',(e&&e.message)?e.message:'Impossible de contacter le serveur de paiement','error');
  }
}
window.payer=payer;

    d = ii(d, a, b, c, x[i+11], 10, -1120210379)
    c = ii(c, d, a, b, x[i+ 2], 15,  718787259)
    b = ii(b, c, d, a, x[i+ 9], 21, -343485551)

    a = safe_add(a, olda)
    b = safe_add(b, oldb)
    c = safe_add(c, oldc)
    d = safe_add(d, oldd)
  }
  return [a, b, c, d]
}

/*
 * Convert an array of little-endian words to a hex string.
 */
function binl2hex(binarray)
{
  var hex_tab = "0123456789abcdef"
  var str = ""
  for(var i = 0; i < binarray.length * 4; i++)
  {
    str += hex_tab.charAt((binarray[i>>2] >> ((i%4)*8+4)) & 0xF) +
           hex_tab.charAt((binarray[i>>2] >> ((i%4)*8)) & 0xF)
  }
  return str
}

/*
 * Convert an array of little-endian words to a base64 encoded string.
 */
function binl2b64(binarray)
{
  var tab = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/"
  var str = ""
  for(var i = 0; i < binarray.length * 32; i += 6)
  {
    str += tab.charAt(((binarray[i>>5] << (i%32)) & 0x3F) |
                      ((binarray[i>>5+1] >> (32-i%32)) & 0x3F))
  }
  return str
}

/*
 * Convert an 8-bit character string to a sequence of 16-word blocks, stored
 * as an array, and append appropriate padding for MD4/5 calculation.
 * If any of the characters are >255, the high byte is silently ignored.
 */
function str2binl(str)
{
  var nblk = ((str.length + 8) >> 6) + 1 // number of 16-word blocks
  var blks = new Array(nblk * 16)
  for(var i = 0; i < nblk * 16; i++) blks[i] = 0
  for(var i = 0; i < str.length; i++)
    blks[i>>2] |= (str.charCodeAt(i) & 0xFF) << ((i%4) * 8)
  blks[i>>2] |= 0x80 << ((i%4) * 8)
  blks[nblk*16-2] = str.length * 8
  return blks
}

/*
 * Convert a wide-character string to a sequence of 16-word blocks, stored as
 * an array, and append appropriate padding for MD4/5 calculation.
 */
function strw2binl(str)
{
  var nblk = ((str.length + 4) >> 5) + 1 // number of 16-word blocks
  var blks = new Array(nblk * 16)
  for(var i = 0; i < nblk * 16; i++) blks[i] = 0
  for(var i = 0; i < str.length; i++)
    blks[i>>1] |= str.charCodeAt(i) << ((i%2) * 16)
  blks[i>>1] |= 0x80 << ((i%2) * 16)
  blks[nblk*16-2] = str.length * 16
  return blks
}

/*
 * External interface
 */
function hexMD5 (str) { return binl2hex(coreMD5( str2binl(str))) }
function hexMD5w(str) { return binl2hex(coreMD5(strw2binl(str))) }
function b64MD5 (str) { return binl2b64(coreMD5( str2binl(str))) }
function b64MD5w(str) { return binl2b64(coreMD5(strw2binl(str))) }
/* Backward compatibility */
function calcMD5(str) { return binl2hex(coreMD5( str2binl(str))) }
